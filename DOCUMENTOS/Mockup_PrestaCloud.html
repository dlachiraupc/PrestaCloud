<title>PrestaCloud</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Diseño: app de cobranza para prestamistas. Navegación inferior en celular, riel de íconos en tablet, barra lateral en escritorio.
   Verde tinta como único acento; rojo, ámbar y azul solo para estados. Cifras con ancho tabular. */
:root{
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-b:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --bg:#F2F5F2; --surface:#FFFFFF; --surface2:#E8EEEA; --ink:#14201D; --ink2:#46544F; --line:#D1DAD5;
  --brand:#0B6B5D; --brand-ink:#FFFFFF; --brand-hover:#074A41; --brand-soft:#DCEEE8; --on-soft:#074A41; --focus:#0B6B5D;
  --ok:#17703A; --ok-bg:#DBF0E1; --warn:#7A4E00; --warn-bg:#F8E7BC; --bad:#A3211A; --bad-bg:#F8DDD9; --info:#17508D; --info-bg:#D9E7F5;
  --c0:#9DB3C0; --c0s:#5B7A8C; --pbar:#14201D; --pbar-ink:#E9F0EC; --proto-h:46px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151F1C; --surface2:#1E2B27; --ink:#E8F0EC; --ink2:#A6B7B0; --line:#2B3A35;
  --brand:#3FB59F; --brand-ink:#04201A; --brand-hover:#63CDB8; --brand-soft:#16312B; --on-soft:#A9E6D8; --focus:#7FE0CB;
  --ok:#74D393; --ok-bg:#15301E; --warn:#F0C262; --warn-bg:#3A2D0D; --bad:#FF9D95; --bad-bg:#3E1B18; --info:#92BDF0; --info-bg:#162A41;
  --c0:#4E6A79; --c0s:#8DB0C4; --pbar:#050A09; --pbar-ink:#CFE0D9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1C; --surface2:#1E2B27; --ink:#E8F0EC; --ink2:#A6B7B0; --line:#2B3A35;
  --brand:#3FB59F; --brand-ink:#04201A; --brand-hover:#63CDB8; --brand-soft:#16312B; --on-soft:#A9E6D8; --focus:#7FE0CB;
  --ok:#74D393; --ok-bg:#15301E; --warn:#F0C262; --warn-bg:#3A2D0D; --bad:#FF9D95; --bad-bg:#3E1B18; --info:#92BDF0; --info-bg:#162A41;
  --c0:#4E6A79; --c0s:#8DB0C4; --pbar:#050A09; --pbar-ink:#CFE0D9; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-b);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--pbar)}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}.ic.fill{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra del prototipo */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:41;height:var(--proto-h);background:var(--pbar);color:var(--pbar-ink)}
.proto .in{height:100%;display:flex;align-items:center;gap:8px;justify-content:space-between}
.ptabs{display:flex;gap:4px;overflow-x:auto;min-width:0}
.ptab{min-height:34px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:inherit;font:600 13px var(--font-b);cursor:pointer;white-space:nowrap;opacity:.8}
.ptab[aria-pressed="true"],.ptab[aria-current="true"]{background:var(--pbar-ink);color:var(--pbar);opacity:1}
.devs{display:none;gap:4px;align-items:center;font-size:12px}
.devs .ptab{min-height:30px;border:1px solid color-mix(in srgb,var(--pbar-ink) 35%,transparent)}
.stagewrap{background:var(--bg)}
.stage{container-type:inline-size;container-name:app;margin-inline:auto;width:100%;background:var(--bg)}
@media (min-width:900px){
  .devs{display:flex}
  .stagewrap.sim{background:var(--surface2);padding-block:20px}
  .stagewrap.sim .stage{border-radius:28px;overflow:clip;box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(0,0,0,.22)}
  .stage.dev-phone{max-width:390px}.stage.dev-tablet{max-width:820px}
}

/* estructura de la app */
.shell{min-height:calc(100dvh - var(--proto-h));display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto;background:var(--bg)}
.shell[data-mode="portal"],.shell[data-mode="public"]{grid-template-rows:1fr}
.side{display:none}
.main{min-width:0;padding-block:20px 28px}
.wrap{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.tabbar{position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.shell[data-mode="portal"] .tabbar,.shell[data-mode="public"] .tabbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border:0;background:transparent;font:600 11px var(--font-b);color:var(--ink2);cursor:pointer}
.tab[aria-current="page"]{color:var(--brand)}
.tab.plus .pb{width:48px;height:48px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.tab.plus{color:var(--ink2)}
.shell[data-mode="app"] .foot{margin-top:8px}
.foot{font-size:12px;color:var(--ink2);text-align:center;padding-block:8px}
@container app (min-width:768px){
  .shell[data-mode="app"]{grid-template-columns:76px minmax(0,1fr);grid-template-rows:1fr}
  .shell[data-mode="app"] .side{display:flex}
  .shell[data-mode="app"] .tabbar{display:none}
  .side{position:sticky;top:calc(var(--proto-h) + env(safe-area-inset-top,0px));align-self:start;height:calc(100dvh - var(--proto-h) - env(safe-area-inset-top,0px));flex-direction:column;gap:4px;padding:16px 10px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
  .side .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px;font:700 18px var(--font-d)}
  .side .brand b{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:16px;flex:none}
  .side .brand span,.side .lbl,.side .planbox,.side .nbadge{display:none}
  .navi{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--ink2);font:600 14.5px var(--font-b);cursor:pointer;text-align:left;width:100%}
  .navi:hover{background:var(--surface2)}
  .navi[aria-current="page"]{background:var(--brand-soft);color:var(--on-soft)}
  .side .grow{flex:1}
}
@container app (min-width:1100px){
  .shell[data-mode="app"]{grid-template-columns:248px minmax(0,1fr)}
  .side .brand span,.side .lbl,.side .planbox,.side .nbadge{display:inline-flex}
  .side .planbox{display:flex}
}
.planbox{flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--ink2)}
.planbox b{color:var(--ink);font:700 14px var(--font-d)}
.nbadge{margin-left:auto;font:700 10px var(--font-b);letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--ink2)}

/* componentes */
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.vh h1{font-size:clamp(24px,5.4cqi,34px);line-height:1.1;font-weight:700}
.sub{color:var(--ink2);margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:600 15px var(--font-b);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warn{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.flat{background:transparent}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ch h2{font-size:17px;font-weight:700}
.meta{font-size:13px;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font:600 11.5px var(--font-b);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.tile .v{font:700 clamp(20px,5.6cqi,28px)/1.1 var(--font-d);overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--ink2)}
.tile.hero{grid-column:1/-1;background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tile.hero .k,.tile.hero .s{color:var(--brand-ink);opacity:.88}
.tile.bad .v{color:var(--bad)}
@container app (min-width:768px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.tile.hero{grid-column:auto}}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
@container app (min-width:1100px){.cols{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.wide-only{display:none}
@container app (min-width:768px){.wide-only{display:block}}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.act{grid-template-columns:auto minmax(0,1fr) auto auto}
.row.link{cursor:pointer}
.row .mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.row .mid b{font-weight:600;overflow-wrap:anywhere}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.row .end b{font:700 16px var(--font-d)}
.row.done .mid b,.row.done .end b{color:var(--ink2)}
.av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--on-soft);display:grid;place-items:center;font:700 14px var(--font-d)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font:600 12px/1.5 var(--font-b);white-space:nowrap;background:var(--surface2);color:var(--ink2)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.info{background:var(--info-bg);color:var(--info)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar>i{display:block;height:100%;background:var(--brand)}
.bar>i.b2{background:var(--c0s)}.bar>i.ok{background:var(--ok)}.bar>i.info{background:var(--info)}.bar>i.warn{background:var(--warn)}.bar>i.bad{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--font-b);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip[disabled]{opacity:.5;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lbl{font:600 13px var(--font-b);color:var(--ink2)}
input,select{font:inherit;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
input[type="checkbox"]{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--brand)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.big{font:700 34px var(--font-d);text-align:center;min-height:68px}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv b{font-weight:600}
.note{padding:12px 14px;border-radius:12px;background:var(--surface2);color:var(--ink2);font-size:13.5px}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.ok{background:var(--ok-bg);color:var(--ok)}.note.info{background:var(--info-bg);color:var(--info)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th{font:600 12px var(--font-b);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:8px 8px 8px 0}
td{padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:middle}
td input,td select{min-height:38px;padding:0 8px}
.axt{fill:var(--ink2);font:12px var(--font-b)}.axv{fill:var(--ink);font:600 11px var(--font-b)}
.grid-l{stroke:var(--line);stroke-width:1}
.s0{fill:var(--c0);stroke:var(--c0s);stroke-width:1}.s1{fill:var(--brand)}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:420px;height:auto}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .chip{flex:1;text-align:center}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.msgbox{white-space:pre-wrap;padding:12px;border-radius:12px;background:var(--surface2);font-size:14px;overflow-wrap:anywhere}
.doc{border:1px dashed var(--line);border-radius:12px;padding:16px;background:var(--bg)}
.doc h3{font-size:16px}
.big-check{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-inline:auto}
.center{text-align:center}
.lock{display:flex;flex-direction:column;align-items:flex-start;gap:12px}

/* diálogos */
dialog.dlg{width:min(560px,calc(100% - 24px));max-width:none;max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 24px 80px rgba(0,0,0,.4);overflow:auto}
dialog.dlg::backdrop{background:rgba(8,16,14,.58)}
.dbox{padding:20px;display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dhead h2{font-size:20px}
.dfoot{display:flex;gap:8px;flex-wrap:wrap}
.dfoot .btn{flex:1}
@media (max-width:640px){dialog.dlg{margin:auto auto 0;width:100%;border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--pbar);color:var(--pbar-ink);padding:10px 16px;border-radius:12px;max-width:min(92vw,420px);font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* sitio público y portal */
.pub{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
.pubhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font:700 19px var(--font-d)}
.logo b{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.hero h1{font-size:clamp(30px,8.5cqi,52px);line-height:1.05;max-width:16ch}
.hero p{max-width:52ch;margin-top:12px;color:var(--ink2);font-size:16px}
.plans{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container app (min-width:900px){.plans{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plan{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.plan.star{border:2px solid var(--brand)}
.plan .price{font:700 36px var(--font-d)}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1}
.plan li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.plan li.no{color:var(--ink2)}
.plan li .ic{margin-top:2px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--surface2)}
.steps i.on{background:var(--brand)}
.authcard{max-width:460px;margin-inline:auto;width:100%;display:flex;flex-direction:column;gap:16px}
.portal{max-width:460px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.urlchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);background:var(--surface2);border-radius:999px;padding:4px 10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></symbol>

/* ================= utilidades ================= */

const p2=n=>String(n).padStart(2,'0');
const fd=n=>p2(dt(n).getUTCDate())+'/'+p2(dt(n).getUTCMonth()+1);

const fdow=n=>DOW[dt(n).getUTCDay()]+' '+fd(n);

/* ================= motor de cálculo (reglas del Excel v13) ================= */
//ENGINE-START
let TRAMOS=[{mod:'C3D',desde:0,tasa:20,n:8,red:0},{mod:'SEMANAL',desde:0,tasa:40,n:8,red:0},{mod:'SEMANAL',desde:500,tasa:45,n:12,red:1}];
const MODS={C3D:{cada:3,fijo:0,label:'Cada 3 días'},SEMANAL:{cada:7,fijo:7,label:'Semanal'}};
const CFG={horaMax:'17:00',tol:0,noRenovar:3,aumento:{PUNTUAL:100,'DESPUÉS DE LA HORA':0,'DESPUÉS DE LA FECHA':0,'NO RENOVAR':0}};
function tramoDe(mod,c){let b=null;TRAMOS.forEach(t=>{if(t.mod===mod&&t.desde*100<=c&&(!b||t.desde>b.desde))b=t});return b}
function primeraFecha(mod,f){const m=MODS[mod];if(m.fijo===0)return f+m.cada;const wd=dt(f).getUTCDay()+1;return f+((((m.fijo-wd-1)%7)+7)%7)+1}
function mkPlan(mod,fecha,c){
  const t=tramoDe(mod,c);if(!t||c<=0)return null;
  const m=MODS[mod];const total=Math.round(c*(100+t.tasa)/100);const n=t.n;
  const unit=t.red>0?t.red*100:1;
  const normal=Math.floor(total/n/unit)*unit;const first=total-(n-1)*normal;
  const f1=primeraFecha(mod,fecha);const dues=[],amts=[];
  for(let i=0;i<n;i++){dues.push(f1+i*m.cada);amts.push(i===0?first:normal)}
  return {tasa:t.tasa,n,total,normal,first,dues,amts,fin:dues[n-1],monto:c,ganancia:total-c,desde:t.desde,red:t.red};
}
function tea(p,fecha){
  const fl=p.dues.map((d,i)=>[d-fecha,p.amts[i]]);let lo=0,hi=1;
  for(let i=0;i<80;i++){const m=(lo+hi)/2;let pv=0;fl.forEach(x=>{pv+=x[1]/Math.pow(1+m,x[0])});if(pv>p.monto)lo=m;else hi=m}
  return Math.pow(1+(lo+hi)/2,365)-1;
}
const cumDue=(pl,k)=>k<=0?0:pl.first+(k-1)*pl.normal;
const cuotaIdx=(pl,paid)=>paid<pl.first?1:Math.min(pl.n,1+Math.floor((paid-pl.first)/pl.normal)+1);
function puntual(day,time,vence){const diff=day-vence;if(diff>CFG.tol)return 'FECHA';if(diff>0||(diff===0&&time>CFG.horaMax))return 'HORA';if(diff<0)return 'ADELANTADO';return 'PUNTUAL'}
//ENGINE-END

/* ================= datos de ejemplo (ficticios) ================= */
const S={today:D(2026,10,26),clients:[],loans:[],pays:[],caja:[],arqueos:[],payN:213,nextPay:1,view:'inicio',cbDate:null,cbFilter:'todos',clFilter:'todos',clQ:'',cartTab:'vigentes',cajaPer:'oct',annual:false,exp:'app'};
S.cbDate=S.today;
const TIPOS={'SALDO INICIAL':1,'APORTE CAPITAL':1,'OTRO INGRESO':1,'RETIRO':-1,'GASTO':-1,'PAGO A INVERSIONISTA':-1,'POR CONFIRMAR':0};

const L=id=>S.loans.find(l=>l.id===id);
const CLI=id=>S.clients.find(c=>c.id===id);

/* ================= cálculos sobre los datos ================= */
function loanPays(id,asOf){return S.pays.filter(p=>p.loan===id&&!p.void&&(asOf==null||p.day<=asOf)).sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time)||a.id-b.id)}
function loanPayRows(loan,asOf){let cum=0;return loanPays(loan.id,asOf).map(p=>{const pl=loan.plan;const j=cuotaIdx(pl,cum);const vence=pl.dues[j-1];const r=Object.assign({},p,{j,vence,pu:puntual(p.day,p.time,vence),tarde:Math.max(0,p.day-vence),antes:cum});cum+=p.amt;r.despues=cum;return r})}
function stats(loan,asOf){
  const pl=loan.plan;const cobrado=loanPays(loan.id,asOf).reduce((a,p)=>a+p.amt,0);const saldo=pl.total-cobrado;
  const venc=pl.dues.filter(d=>d<asOf).length;const atraso=Math.max(0,cumDue(pl,venc)-cobrado);
  const pagadas=cobrado<pl.first?0:Math.min(pl.n,1+Math.floor((cobrado-pl.first)/pl.normal));
  let estado='AL DÍA';if(saldo<=0)estado='CANCELADO';else if(asOf<loan.fecha)estado='PROGRAMADO';else if(atraso>0)estado='ATRASADO';
  const prox=saldo<=0?null:pl.dues[Math.min(pagadas,pl.n-1)];
  const dias=atraso>0?asOf-prox:0;
  const capital=(estado==='CANCELADO'||estado==='PROGRAMADO')?0:Math.round(saldo*100/(100+pl.tasa));
  return {cobrado,saldo,venc,atraso,pagadas,estado,prox,dias,capital,ganCob:Math.round(cobrado*pl.tasa/(100+pl.tasa))};
}
function ciclo(loan){return S.loans.filter(l=>l.cli===loan.cli&&l.mod===loan.mod&&(l.fecha<loan.fecha||(l.fecha===loan.fecha&&l.id<=loan.id))).length}
function dueOn(day){const out=[];S.loans.forEach(l=>{const pl=l.plan;const i=pl.dues.indexOf(day);if(i<0||day<l.fecha)return;const cob=loanPays(l.id).reduce((a,p)=>a+p.amt,0);const lo=cumDue(pl,i),hi=cumDue(pl,i+1);const amt=Math.max(0,hi-Math.max(cob,lo));if(amt>0)out.push({loan:l,k:i+1,amt})});return out}
function cobranzaRows(d){
  const out=[];
  S.loans.forEach(l=>{
    if(d<l.fecha)return;const pl=l.plan;const all=loanPays(l.id,d);
    const before=all.filter(p=>p.day<d).reduce((a,p)=>a+p.amt,0);const onD=all.filter(p=>p.day===d);const paidOn=onD.reduce((a,p)=>a+p.amt,0);
    const le=pl.dues.filter(x=>x<=d).length,lt=pl.dues.filter(x=>x<d).length;
    const total=Math.max(0,cumDue(pl,le)-before);const atraso=Math.max(0,cumDue(pl,lt)-before);
    if(total<=0&&paidOn<=0)return;
    const falta=Math.max(0,cumDue(pl,le)-(before+paidOn));const idx=pl.dues.indexOf(d);
    const k=idx>=0?idx+1:Math.min(pl.n,stats(l,d).pagadas+1);
    const pr=loanPayRows(l,d).filter(x=>x.day===d);
    const status=paidOn>0?(falta>0?'Parcial':'Cobrado'):(atraso>0?'Atrasado':'Pendiente');
    out.push({loan:l,cli:CLI(l.cli),total,atraso,cuotaDia:Math.max(0,total-atraso),paidOn,falta,k,status,time:onD.length?onD[onD.length-1].time:null,pu:pr.length?pr[pr.length-1].pu:null});
  });
  const ord={Atrasado:0,Pendiente:1,Parcial:1,Cobrado:2};
  return out.sort((a,b)=>ord[a.status]-ord[b.status]||b.atraso-a.atraso||a.cli.dim.localeCompare(b.cli.dim));
}
function cajaHasta(d){
  let s=0;S.caja.forEach(c=>{if(c.d<=d)s+=c.m*TIPOS[c.t]});
  S.pays.forEach(p=>{if(!p.void&&p.day<=d)s+=p.amt});S.loans.forEach(l=>{if(l.fecha<=d)s-=l.monto});return s;
}
function cajaRango(desde,hasta){
  const ini=cajaHasta(desde-1);let cobros=0,ing=0,pres=0,ret=0;
  S.pays.forEach(p=>{if(!p.void&&p.day>=desde&&p.day<=hasta)cobros+=p.amt});
  S.loans.forEach(l=>{if(l.fecha>=desde&&l.fecha<=hasta)pres+=l.monto});
  S.caja.forEach(c=>{if(c.d>=desde&&c.d<=hasta){const e=c.m*TIPOS[c.t];if(e>0)ing+=e;else ret-=e}});
  const fin=ini+cobros+ing-pres-ret;return {ini,cobros,ing,pres,ret,fin,control:fin-cajaHasta(hasta)};
}
function clientPays(cid){const r=[];S.loans.filter(l=>l.cli===cid).forEach(l=>loanPayRows(l,S.today).forEach(x=>r.push(Object.assign({code:l.id,mod:l.mod},x))));return r.sort((a,b)=>b.day-a.day||b.time.localeCompare(a.time))}
function calif(cid){
  const r=clientPays(cid);const c={PUNTUAL:0,ADELANTADO:0,HORA:0,FECHA:0};r.forEach(x=>{c[x.pu]++});let cal='';
  if(r.length)cal=c.FECHA>=CFG.noRenovar?'NO RENOVAR':c.FECHA>=1?'DESPUÉS DE LA FECHA':c.HORA>=1?'DESPUÉS DE LA HORA':'PUNTUAL';
  return {cal,c,total:r.length,pays:r};
}
function sugerido(cid){
  const k=calif(cid);const ls=S.loans.filter(l=>l.cli===cid).sort((a,b)=>a.fecha-b.fecha||a.id.localeCompare(b.id));
  const last=ls.length?ls[ls.length-1]:null;const base=last?last.monto:20000;
  const renueva=k.cal===''||k.cal==='PUNTUAL'||k.cal==='DESPUÉS DE LA HORA';
  const aum=k.cal?CFG.aumento[k.cal]*100:0;
  return {cal:k.cal,renueva,base,monto:renueva?base+aum:0,mod:last?last.mod:'C3D',tiene:!!last};
}
function kpis(){
  let porCobrar=0,capital=0,gan=0,vig=0,atrAmt=0;const atrN=new Set();
  S.loans.forEach(l=>{const s=stats(l,S.today);gan+=s.ganCob;if(s.estado==='AL DÍA'||s.estado==='ATRASADO'){vig++;porCobrar+=s.saldo;capital+=s.capital}if(s.atraso>0){atrN.add(l.cli);atrAmt+=s.atraso}});
  const rows=cobranzaRows(S.today);const man=dueOn(S.today+1);const caja=cajaHasta(S.today);
  return {caja,total:rows.reduce((a,r)=>a+r.total,0),cobrado:S.pays.filter(p=>!p.void&&p.day===S.today).reduce((a,p)=>a+p.amt,0),falta:rows.reduce((a,r)=>a+r.falta,0),nCuotas:rows.filter(r=>r.total>0).length,vig,porCobrar,capital,gan,atrN:atrN.size,atrAmt,man:man.reduce((a,x)=>a+x.amt,0),manN:man.length,pat:caja+porCobrar,
    avance:(function(){const t=rows.reduce((a,r)=>a+r.total,0);const c=rows.reduce((a,r)=>a+Math.min(r.paidOn,r.total),0);return t?Math.round(c*100/t):0})()};
}

function dateLong(n){const x=dt(n);return DOWL[x.getUTCDay()][0].toUpperCase()+DOWL[x.getUTCDay()].slice(1)+' '+x.getUTCDate()+' de '+MES[x.getUTCMonth()]+' de '+x.getUTCFullYear()}
function niceMax(v){const steps=[50,100,200,250,500,1000,2000,2500,5000];const s=steps.find(x=>x*4>=v)||10000;return Math.max(s*4,s)}
function barChart(labels,series){
  const W=640,H=236,pl=46,pr=8,pt=22,pb=30;const iw=W-pl-pr,ih=H-pt-pb;
  let mx=0;series.forEach(s=>s.v.forEach(x=>{mx=Math.max(mx,x/100)}));const top=niceMax(mx||50);const step=top/4;
  let g='';for(let i=0;i<=4;i++){const y=pt+ih-(ih*i/4);g+='<line class="grid-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text class="axt" x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+nf0.format(step*i)+'</text>'}
  const gw=iw/labels.length;const bw=Math.min(40,(gw-14)/series.length);let bars='';
  labels.forEach((lb,i)=>{
    const gx=pl+gw*i+(gw-bw*series.length)/2;
    series.forEach((s,j)=>{const v=s.v[i]/100;const h=ih*v/top;const x=gx+bw*j;const y=pt+ih-h;
      bars+='<rect class="s'+s.k+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-3).toFixed(1)+'" height="'+Math.max(h,0).toFixed(1)+'" rx="3"/>';
      if(v>0)bars+='<text class="axv" x="'+(x+(bw-3)/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle">'+nf0.format(v)+'</text>'});
    bars+='<text class="axt" x="'+(pl+gw*i+gw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+lb+'</text>';
  });
  return '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de barras en soles">'+g+bars+'</svg></div>';
}
function weeklyData(){
  const mon=D(2026,9,21);const labels=[],col=[],cob=[];
  for(let i=0;i<5;i++){const a=mon+i*7,b=a+6;labels.push('sem '+fd(a));
    col.push(S.loans.filter(l=>l.fecha>=a&&l.fecha<=b).reduce((s,l)=>s+l.monto,0));
    cob.push(S.pays.filter(p=>!p.void&&p.day>=a&&p.day<=b).reduce((s,p)=>s+p.amt,0))}
  return {labels,col,cob};
}
function chartColocado(){const w=weeklyData();return '<div class="legend" style="margin:0 0 4px"><span><i style="background:var(--c0);border:1px solid var(--c0s)"></i>Colocado (préstamos entregados)</span><span><i style="background:var(--brand)"></i>Cobrado</span></div>'+barChart(w.labels,[{k:0,v:w.col},{k:1,v:w.cob}])}

  const plan=pl.first===pl.normal?pl.n+' × '+money(pl.normal):'1 × '+money(pl.first)+' + '+(pl.n-1)+' × '+money(pl.normal);
  const idx=NP.all?pl.dues.map((d,i)=>i):[0,1,2,-1,pl.n-1];
  const sch=idx.map(i=>i<0?'<li class="row"><span class="meta">…</span><span></span><span></span></li>':'<li class="row"><span class="mid"><b>Cuota '+(i+1)+' · '+fdow(pl.dues[i])+'</b></span><span></span><span class="end"><b>'+money(pl.amts[i])+'</b></span></li>').join('');

/* ---- registrar pago ---- */
let P=null;
function nextPending(afterLoan){const rows=cobranzaRows(S.today).filter(r=>r.falta>0);if(!rows.length)return null;const i=rows.findIndex(r=>r.loan.id===afterLoan);return rows[(i+1)%rows.length].loan.id===afterLoan?null:rows[(i+1)%rows.length]}
function openPago(loanId){
  const loan=L(loanId);const st=stats(loan,S.today);if(st.saldo<=0){toast('Este préstamo ya está pagado');return}
  const pl=loan.plan;const idx=cuotaIdx(pl,st.cobrado);const cuota=Math.min(st.saldo,cumDue(pl,idx)-st.cobrado);
  const r=cobranzaRows(S.today).find(x=>x.loan.id===loanId);const hoy=r?r.falta:0;
  P={loan:loanId,mode:'cuota',monto:cuota,cuota,hoy:Math.min(st.saldo,Math.max(hoy,cuota)),clock:'11:42',time:'11:42',day:S.today,medio:'Efectivo',edit:false,stage:'form',what:false,doc:false,payId:null};
  openDlg(pagoHTML());pgPrev();
}
function pgCalc(){
  const loan=L(P.loan),pl=loan.plan,st=stats(loan,P.day);const idx=cuotaIdx(pl,st.cobrado);const vence=pl.dues[idx-1];
  return {loan,pl,st,idx,vence,pu:puntual(P.day,P.time,vence),saldoDesp:st.saldo-P.monto,ok:P.monto>0&&P.monto<=st.saldo};
}
function pagoHTML(){
  if(P.stage==='ok')return okHTML();
  const c=CLI(L(P.loan).cli);const k=pgCalc();
  const chipM=(m,t)=>'<button class="chip" data-act="pg-mode" data-m="'+m+'" aria-pressed="'+(P.mode===m)+'">'+t+'</button>';
  return '<div class="dbox">'+dHead('Registrar pago')+
   '<div><b>'+esc(c.dim)+'</b><p class="meta">'+k.loan.id+' · '+MODS[k.loan.mod].label+' · cuota '+k.idx+' de '+k.pl.n+'</p></div>'+
   '<div class="fld"><label for="pg-m">Monto recibido (S/)</label><input id="pg-m" class="big" inputmode="decimal" value="'+(P.monto/100)+'" autocomplete="off"></div>'+
   '<div class="chips">'+chipM('cuota','Cuota '+money(P.cuota))+(P.hoy>P.cuota?chipM('hoy','Todo lo de hoy '+money(P.hoy)):'')+chipM('otro','Otro monto')+'</div>'+
   '<div class="kv" style="border:0"><span>Fecha y hora</span><b>'+fdy(P.day)+' · '+fT(P.time)+' '+(P.edit?'':'<span class="meta">(automática)</span>')+'</b></div>'+
   (P.edit?'<div class="grid2"><div class="fld"><label for="pg-d">Fecha</label><input id="pg-d" type="date" max="'+iso(S.today)+'" value="'+iso(P.day)+'"></div><div class="fld"><label for="pg-t">Hora</label><input id="pg-t" type="time" value="'+P.time+'"></div></div><p class="note info">El cambio de fecha u hora queda registrado en la auditoría.</p>':'<button class="btn ghost sm" style="align-self:flex-start" data-act="pg-edit">Editar fecha u hora</button>')+
   '<div id="pg-prev"></div>'+
   '<div class="fld"><span class="lbl">Medio</span><div class="chips">'+['Efectivo','Yape','Plin','Transferencia'].map(m=>'<button class="chip" data-act="pg-medio" data-m="'+m+'" aria-pressed="'+(P.medio===m)+'">'+m+'</button>').join('')+'</div></div>'+
   '<div class="note" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span>Demostración: simular la hora del pago</span><button class="chip" style="min-height:34px" data-act="pg-clock" data-t="11:42" aria-pressed="'+(P.clock==='11:42')+'">11:42 am</button><button class="chip" style="min-height:34px" data-act="pg-clock" data-t="17:30" aria-pressed="'+(P.clock==='17:30')+'">5:30 pm</button></div>'+
   '<div class="dfoot"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" id="pg-ok" data-act="pg-ok">Confirmar pago</button></div></div>';
}
function pgPrev(){
  if(!P||P.stage!=='form')return;const el=$('#pg-prev');if(!el)return;const k=pgCalc();
  let msg='';
  if(k.pu==='HORA'&&P.day===k.vence)msg='<p class="meta">Se registra después de las '+fT(CFG.horaMax)+': contará como «Después de la hora».</p>';
  else if(k.pu==='FECHA')msg='<p class="meta">Pasó '+(P.day-k.vence)+' día'+(P.day-k.vence>1?'s':'')+' de la fecha de la cuota.</p>';
  else if(k.pu==='ADELANTADO')msg='<p class="meta">La cuota vence '+fdow(k.vence)+'. Es un pago adelantado.</p>';
  el.innerHTML='<div class="card" style="background:var(--bg)"><div class="kv" style="border:0"><span>Puntualidad</span>'+puTag(k.pu)+'</div>'+msg+'<div class="kv"><span>Cuota que cubre</span><b>'+k.idx+' de '+k.pl.n+' · vencía '+fdow(k.vence)+'</b></div><div class="kv"><span>Saldo después del pago</span><b style="color:'+(k.saldoDesp<0?'var(--bad)':'inherit')+'">'+money(Math.max(k.saldoDesp,0))+'</b></div>'+(P.monto>k.st.saldo?'<p class="note bad" role="alert">El monto supera el saldo del préstamo ('+money(k.st.saldo)+').</p>':'')+'</div>';
  const b=$('#pg-ok');if(b)b.disabled=!k.ok;
}

  const row=loanPayRows(loan,pay.day).find(x=>x.id===pay.id);const st=stats(loan,pay.day);const num=String(pay.n).padStart(6,'0');

   '<div class="card" style="text-align:left"><div class="kv" style="border:0"><span>Constancia de pago N.º</span><b>'+num+'</b></div><div class="kv"><span>Cuota</span><b>'+row.j+' de '+loan.plan.n+'</b></div><div class="kv"><span>Puntualidad</span>'+puTag(row.pu)+'</div><div class="kv"><span>Saldo</span><b>'+money(st.saldo)+'</b></div><div class="kv"><span>Próxima cuota</span><b>'+(nxt?fdow(nxt):'—')+'</b></div></div>'+
   (st.saldo<=0?'<p class="note ok" style="text-align:left">Préstamo cancelado.'+(sg.renueva?' Puede renovar por '+money(sg.monto)+'.':'')+'</p>':'')+
   (P.what?'<div style="text-align:left" class="stack"><div class="msgbox" id="wmsg">'+esc(wm)+'</div><div class="acts"><button class="btn ghost sm" data-act="copy" data-t="'+esc(wm)+'">'+ic('copy','sm')+' Copiar mensaje</button><a class="btn sm" href="https://wa.me/?text='+encodeURIComponent(wm)+'" target="_blank" rel="noopener">Abrir WhatsApp</a></div></div>':'')+
   (P.doc?'<div class="doc" style="text-align:left"><h3>Constancia de pago</h3><p class="meta">Préstamos Daniel · N.º '+num+'</p><div class="kv"><span>Cliente</span><b>'+esc(c.nombre)+'</b></div><div class="kv"><span>Monto pagado</span><b>'+money(pay.amt)+'</b></div><div class="kv"><span>Cuota</span><b>'+row.j+' de '+loan.plan.n+'</b></div><div class="kv"><span>Saldo</span><b>'+money(st.saldo)+'</b></div><p class="meta" style="margin-top:8px">Constancia interna, no es comprobante SUNAT. En la app real se descarga como PDF.</p></div>':'')+
   '<div class="dfoot"><button class="btn ghost" data-act="pg-what">'+ic('chat','sm')+' Enviar por WhatsApp</button><button class="btn ghost" data-act="pg-doc">'+ic('file','sm')+' '+(P.doc?'Ocultar constancia':'Ver constancia')+'</button></div>'+
   (nx?'<button class="btn block" data-act="pg-next" data-loan="'+nx.loan.id+'">Siguiente cliente: '+esc(nx.cli.dim)+' '+ic('right','sm')+'</button>':'<button class="btn block" data-act="close">Listo, no quedan cobros</button>')+'</div>';
}

  nuevocli(){closeDlg();cliDlg()},
  movimiento(){closeDlg();movDlg()},
  'wsp-cli'(e){const c=CLI(e.dataset.c);const rows=cobranzaRows(S.today).find(r=>r.cli.id===c.id);const t=rows&&rows.falta>0?'Hola '+c.nombre.split(' ')[0]+', te recordamos que hoy '+fd(S.today)+' toca tu cuota de '+money(rows.falta)+'. Puedes pagar antes de las '+fT(CFG.horaMax)+' para mantener tu calificación. Gracias.':'Hola '+c.nombre.split(' ')[0]+', gracias por tu puntualidad. Si necesitas un nuevo préstamo, escríbenos.';msgDlg('Mensaje para '+c.dim,t)},
  renovar(e){const sg=sugerido(e.dataset.c);NP={cli:e.dataset.c,mod:sg.mod,monto:sg.monto,fecha:S.today,sim:false,confirm:false,all:false,aporte:false};go('prestamo')},
  'np-mod'(e){NP.mod=e.dataset.m;NP.confirm=false;refreshNP()},
  'np-monto'(e){NP.monto=+e.dataset.v*100;NP.confirm=false;const i=$('#np-monto');if(i)i.value=NP.monto/100;refreshNP()},
  'np-sim'(e){NP.sim=e.dataset.s==='1';NP.confirm=false;renderMain()},
  'np-all'(){NP.all=!NP.all;npPrev()},
  'np-aporte'(){const f=NP.monto-cajaHasta(S.today);S.caja.push({d:S.today,t:'APORTE CAPITAL',m:f,det:'Aporte para cubrir un préstamo'});toast('Aporte de '+money(f)+' registrado');NP.aporte=true;npPrev()},
  'np-go'(){NP.confirm=true;npPrev()},'np-cancel'(){NP.confirm=false;npPrev()},
  'np-ok'(){
    const pl=mkPlan(NP.mod,NP.fecha,NP.monto);if(!pl)return;
    const id='P'+String(S.loans.length+1).padStart(3,'0');S.loans.push({id,cli:NP.cli,mod:NP.mod,fecha:NP.fecha,monto:NP.monto,plan:pl});
    const cid=NP.cli;NP.confirm=false;NP.aporte=false;toast('Préstamo '+id+' entregado a '+CLI(cid).dim);go('ficha',cid);
  },
  cajaper(e){S.cajaPer=e.dataset.p;renderMain()},
  exportar(){toast('En la app real se descarga un archivo .xlsx')},
  annual(e){S.annual=e.dataset.a==='1';renderMain()},
  entrar(){R.done=false;go('inicio')},
  'r-mod'(e){const m=e.dataset.m;R.mods[m]=!R.mods[m];e.setAttribute('aria-pressed',String(!!R.mods[m]))},
  'r-show'(){saveReg();R.show=!R.show;renderMain();const i=$('#r-pw');if(i)i.focus()},
  'r-back'(){saveReg();R.step=Math.max(1,R.step-1);R.err='';renderMain()},
  'arq-ok'(e){const c=+e.dataset.c;const dif=c-cajaHasta(S.today);S.arqueos.push({d:S.today,dif});toast(dif===0?'Arqueo registrado: la caja cuadra':'Arqueo registrado con diferencia de '+money(dif));renderMain()},
  'arq-nota'(e){const dif=+e.dataset.d;S.caja.push({d:S.today,t:'POR CONFIRMAR',m:Math.abs(dif),det:'Diferencia de arqueo'});toast('Anotada como POR CONFIRMAR');renderMain()}
};
function refreshNP(){document.querySelectorAll('[data-act="np-mod"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===NP.mod)));document.querySelectorAll('[data-act="np-monto"]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v*100===NP.monto)));npPrev()}
function saveReg(){const g=id=>{const e=$('#'+id);return e?e.value:null};
  if(R.step===1){R.nombre=g('r-nombre')??R.nombre;R.cel=g('r-cel')??R.cel;R.mail=g('r-mail')??R.mail}
  if(R.step===2){R.neg=g('r-neg')??R.neg;R.slug=g('r-slug')??R.slug;R.cant=g('r-cant')??R.cant}
  if(R.step===3){R.pw=g('r-pw')??R.pw;const a=$('#r-t1'),b=$('#r-t2');if(a)R.t1=a.checked;if(b)R.t2=b.checked}}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;
  if(el.tagName==='A'&&el.dataset.act==='go')e.preventDefault();f(el);
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='pg-m'&&P){P.monto=parseM(t.value);P.mode='otro';document.querySelectorAll('[data-act="pg-mode"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m==='otro')));pgPrev()}
  else if(id==='pg-d'&&P){P.day=t.value?fromIso(t.value):P.day;pgPrev()}
  else if(id==='pg-t'&&P){P.time=t.value||P.time;pgPrev()}
  else if(id==='np-monto'){NP.monto=parseM(t.value);NP.confirm=false;document.querySelectorAll('[data-act="np-monto"]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v*100===NP.monto)));npPrev()}
  else if(id==='np-fecha'){NP.fecha=t.value?fromIso(t.value):NP.fecha;npPrev()}
  else if(id==='cl-q'){S.clQ=t.value;const pos=t.selectionStart;renderMain();const n=$('#cl-q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
  else if(id==='mv-t'){}
  else if(id==='arq-in'){const c=parseM(t.value);const el=$('#arq-res');if(!el)return;if(!t.value.trim()){el.innerHTML='';return}const dif=c-cajaHasta(S.today);
    el.innerHTML=dif===0?'<p class="note ok">La caja cuadra.</p><button class="btn block" style="margin-top:8px" data-act="arq-ok" data-c="'+c+'">Registrar arqueo</button>':'<p class="note '+(dif<0?'bad':'warn')+'">'+(dif<0?'Faltan ':'Sobran ')+money(Math.abs(dif))+' respecto al sistema.</p><div class="acts" style="margin-top:8px"><button class="btn" data-act="arq-ok" data-c="'+c+'">Registrar arqueo</button><button class="btn ghost" data-act="arq-nota" data-d="'+dif+'">Anotar como POR CONFIRMAR</button></div>'}
  else if(id==='r-neg'){const s=$('#r-slug');if(s&&!s.dataset.touched){s.value=slugify(t.value);R.slug=s.value;slugMsg()}}
  else if(id==='r-slug'){t.dataset.touched='1';R.slug=slugify(t.value);slugMsg()}
});
function slugMsg(){const m=$('#r-slugm');if(!m)return;const ok=R.slug&&!['admin','demo','prestamos','www'].includes(R.slug);m.textContent=R.slug?R.slug+'.prestacloud.pe · '+(ok?'disponible':'no disponible, prueba otro'):'Se completa sola con el nombre del negocio'}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='np-cli'){NP.cli=t.value;NP.confirm=false;npPrev()}
  else if(t.id==='mv-t'){const s=TIPOS[t.value];const m=$('#mv-s');if(m)m.textContent=s>0?'Suma a la caja.':s<0?'Resta de la caja.':'Solo se anota, no cambia la caja.'}
  else if(t.dataset&&t.dataset.tr!==undefined){const tr=TRAMOS[+t.dataset.tr];const v=Number(t.value);if(isFinite(v)){tr[t.dataset.f]=t.dataset.f==='tasa'||t.dataset.f==='desde'||t.dataset.f==='n'||t.dataset.f==='red'?Math.max(0,v):v;toast('Guardado. No cambia préstamos ya entregados')}}
  else if(t.id==='cfg-hora'){CFG.horaMax=t.value||CFG.horaMax;toast('Hora máxima: '+fT(CFG.horaMax))}
  else if(t.id==='cfg-tol'){CFG.tol=Math.max(0,+t.value||0);toast('Tolerancia: '+CFG.tol+' día(s)')}
  else if(t.id==='cfg-nr'){CFG.noRenovar=Math.max(1,+t.value||1);toast('NO RENOVAR desde '+CFG.noRenovar+' pagos tarde')}
  else if(t.id==='r-cant'){R.cant=t.value}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.id;
  if(f==='f-login'){go('inicio');return}
  if(f==='f-reg'){
    saveReg();R.err='';
    if(R.step===1){if(R.nombre.trim().length<3)R.err='Escribe tu nombre.';else if(R.cel.replace(/\D/g,'').length<9)R.err='El celular debe tener 9 dígitos.';else R.step=2}
    else if(R.step===2){if(R.neg.trim().length<3)R.err='Escribe el nombre de tu negocio.';else if(!R.slug||['admin','demo','prestamos','www'].includes(R.slug))R.err='Elige otra dirección web.';else R.step=3}
    else{if(R.pw.length<8)R.err='La contraseña debe tener al menos 8 caracteres.';else if(!R.t1)R.err='Debes aceptar los términos para continuar.';else R.done=true}
    renderMain();return;
  }
  if(f==='f-mov'){const m=parseM($('#mv-m').value);if(m<=0){toast('Escribe un monto mayor a cero');return}
    S.caja.push({d:$('#mv-d').value?fromIso($('#mv-d').value):S.today,t:$('#mv-t').value,m,det:$('#mv-x').value.trim()});closeDlg();toast('Movimiento guardado');renderMain();return}
  if(f==='f-cli'){const n=$('#nc-n').value.trim(),d=$('#nc-d').value.trim(),t=$('#nc-t').value.trim();
    const dup=S.clients.find(c=>c.dim.toLowerCase()===d.toLowerCase()||(t&&c.tel.replace(/\s/g,'')===t.replace(/\s/g,'')));
    if(dup){cliDlg('Ya existe «'+esc(dup.dim)+'» con ese apodo o celular. Cambia el dato para evitar duplicados.');return}
    const id='C'+String(S.clients.length+1).padStart(3,'0');S.clients.push({id,nombre:n,dim:d,tel:t||'Sin celular',ref:$('#nc-r').value.trim()||'Sin referencia',desde:S.today});closeDlg();toast('Cliente '+d+' guardado');go('ficha',id);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('row')&&e.target.dataset.act){A[e.target.dataset.act]&&A[e.target.dataset.act](e.target)}});

/* ================= inicio ================= */
(function boot(){
  document.querySelectorAll('.devs [data-act="dev"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.w==='full')));
  const h=(location.hash||'').replace('#','');
  const map={inicio:'inicio',panel:'inicio',cartera:'cartera',cobranza:'cobranza',prestamo:'prestamo',ficha:'ficha',clientes:'clientes',caja:'caja',reportes:'reportes',config:'config',portal:'portal',planes:'planes',registro:'registro',login:'login',cobradores:'cobradores'};
  if(h==='pago'){go('cobranza');const r=cobranzaRows(S.today).find(x=>x.falta>0);if(r)openPago(r.loan.id);}
  else if(h==='constancia'){go('cobranza');openConstancia()}
  else go(map[h]||'inicio',h==='ficha'?'C008':h==='portal'?'C008':null);
})();
})();
</script>
